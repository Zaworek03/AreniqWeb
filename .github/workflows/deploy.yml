name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # "Publikuj na stronie" in the admin panel (Supabase function publish-site).
  repository_dispatch:
    types: [publish-content]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # Custom domain later: set both to the domain setup ("" and https://areniq.pl)
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
          # Repo Settings → Secrets and variables → Actions → Variables → FORMSPREE_FORM_ID.
          # Not a secret: the form ID ends up in the page anyway.
          NEXT_PUBLIC_FORMSPREE_FORM_ID: ${{ vars.FORMSPREE_FORM_ID }}
          # Same place, variable UMAMI_WEBSITE_ID (cloud.umami.is → Settings → Websites). Empty = no analytics.
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
          # Variables SUPABASE_URL and SUPABASE_ANON_KEY (Supabase → Project Settings → API).
          # Public by design; access is enforced by RLS. Never put the service_role key here.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
